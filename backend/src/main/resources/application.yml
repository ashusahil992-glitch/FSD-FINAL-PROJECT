server:
  port: 8080

spring:
  application:
    name: campusbazaar
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campusbazaar?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 30
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_ENABLED:true}
  admin:
    email: ${ADMIN_EMAIL:admin@campusbazaar.demo}
    password: ${ADMIN_PASSWORD:ChangeMe@123}
